<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Error 404 Sietelsa" />
        <meta name="author" content="Sietelsa" />
        <title>404 Error - Sietelsa</title>
                <link rel="icon" type="image/jpeg" href="/assets/img/logos/sietelsaPestana.jpg" />
<link href="/admin/css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <style>
            .error-logo {
                width: min(260px, 70vw);
                height: auto;
            }

            .error-card {
                background: #ffffff;
                border: 1px solid #e9ecef;
                border-radius: 16px;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
                padding: 2rem 1.5rem;
            }
        </style>
    </head>
    <body>
        <div id="layoutError">
            <div id="layoutError_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-6">
                                <div class="text-center mt-5 error-card">
                                    <img class="mb-4 error-logo" src="/assets/img/logos/logoSietelsa.webp" alt="Logo Sietelsa" />
                                    <h1 class="h3 mb-3">Error 404</h1>
                                    <p class="lead mb-4">La URL solicitada no existe en este servidor.</p>
                                    <a href="/">
                                        <i class="fas fa-arrow-left me-1"></i>
                                        Volver al inicio
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutError_footer">
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-center small">
                            <div class="text-muted">Copyright &copy; Sietelsa 2026</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="/admin/js/scripts.js"></script>
    </body>
</html>
